<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f6f1" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>命理排盘 · 排盘交给代码，解读交给 AI</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231e6b5e' stroke-width='2'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Ccircle cx='12' cy='12' r='2'/%3E%3C/svg%3E"
    />
    <script>
      // 首屏前定主题，避免闪白
      try {
        const s = JSON.parse(localStorage.getItem('sm_theme') || 'null')
        const mode = s?.mode ?? s?.theme ?? 'system'
        const tg = window.Telegram?.WebApp
        const tgScheme = tg && tg.platform && tg.platform !== 'unknown' ? tg.colorScheme : null
        const dark = mode === 'dark' || (mode === 'system' && (tgScheme ? tgScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches))
        if (dark) document.documentElement.dataset.theme = 'dark'
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
